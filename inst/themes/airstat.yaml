banner:
  title: "Air Quality Map"
  background: "#589636"

map:
  vignette: true
  boundary_labels: false
  symbol_labels: false
  zoom_level: 11
  # Clean light basemap. Was CartoDB.Positron until 2026-09-22: Carto
  # watermarks "API KEY REQUIRED" on a map opened from disk (defect 18). Esri's
  # grey canvas is the nearest pale style that renders from disk without a key.
  base_tiles: "Esri.WorldGrayCanvas"

controls:
  autoplay: false
  # play_speed unset (2026-08-05): the pace follows the step count. Name a
  # value here only to override that.
