<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>{{LEAFLET_CSS}}</style>
<style>
  body { margin:0; font-family:sans-serif; display:flex; flex-direction:column; height:100vh; }
  #map { flex-grow:1; }
  #controls { background:rgba(255,255,255,.92); padding:8px 12px; border-radius:4px;
    position:absolute; top:10px; right:10px; z-index:1000; width:280px;
    box-shadow:0 1px 4px rgba(0,0,0,.3); }
  #timeLabel { font-weight:bold; text-align:center; margin-bottom:4px; }
  input[type=range]{ width:100%; }
  #stats { position:absolute; bottom:10px; left:10px; z-index:1000;
    background:rgba(255,255,255,.85); font:11px monospace; padding:4px 6px; }
</style>
<script>{{LEAFLET_JS}}</script>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <div id="timeLabel"></div>
  <input type="range" id="slider" min="0" max="0" value="0"/>
  <div style="text-align:center;margin-top:4px;"><button id="playBtn">Play</button></div>
</div>
<div id="stats"></div>
<script>
var DATA = {{DATA_JSON}};
var BOUNDARY = {{BOUNDARY_JSON}};
var SCHOOLS = {{SCHOOLS_JSON}};

var map = L.map('map', { preferCanvas: true });
map.fitBounds(DATA.sites.map(function (s) { return [s.lat, s.lon]; }),
  { padding: [20, 20] });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

function colourFor(v) {
  if (v === null || v === undefined) return DATA.colours[DATA.colours.length - 1];
  for (var i = 1; i < DATA.thresholds.length; i++)
    if (v < DATA.thresholds[i]) return DATA.colours[i - 1];
  return DATA.colours[DATA.thresholds.length - 1];
}

// boundary polygon (item: polygon overlay with transparency)
L.geoJSON(BOUNDARY, { renderer: L.svg(), style: { color: '#005794',
  weight: 2.5, fill: true, fillOpacity: 0.05 } }).addTo(map);

// second symbol type: Canvas-rendered square (proves multi-shape on Canvas)
var SquareMarker = L.CircleMarker.extend({
  _updatePath: function () {
    var p = this._point, r = this._radius, ctx = this._renderer._ctx;
    if (!this._renderer._drawing || this._empty()) return;
    ctx.beginPath();
    ctx.rect(p.x - r, p.y - r, 2 * r, 2 * r);
    this._renderer._fillStroke(ctx, this);
  }
});

// static overlay across all time steps (schools as blue squares)
SCHOOLS.features.forEach(function (f) {
  var c = f.geometry.coordinates;
  new SquareMarker([c[1], c[0]], { radius: 5, color: '#1a3f6f', weight: 1,
    fillColor: '#4a90d9', fillOpacity: 0.9 })
    .bindTooltip(f.properties.name).addTo(map);
});

// temporal markers: one Canvas circle per site, recoloured per step
var markers = [];
DATA.sites.forEach(function (s, i) {
  var mk = L.circleMarker([s.lat, s.lon], { radius: 7, color: '#555',
    weight: 1, fillOpacity: 0.95, fillColor: '#ccc' }).addTo(map);
  mk.bindTooltip('', { direction: 'top' });
  markers.push(mk);
});

var slider = document.getElementById('slider'),
    label = document.getElementById('timeLabel'),
    stats = document.getElementById('stats'),
    playBtn = document.getElementById('playBtn');
slider.max = DATA.times.length - 1;

function setTime(idx) {
  var t0 = performance.now();
  label.textContent = DATA.times[idx];
  DATA.sites.forEach(function (s, i) {
    var v = s.v[idx];
    markers[i].setStyle({ fillColor: colourFor(v) });
    markers[i].setTooltipContent(s.code + '<br>' +
      (v === null ? 'no data' : v + ' µg/m³'));
  });
  stats.textContent = 'step ' + idx + ' · restyle ' +
    (performance.now() - t0).toFixed(1) + ' ms';
}
setTime(0);

slider.addEventListener('input', function (e) { setTime(+e.target.value); });
var playing = false, timer = null;
playBtn.addEventListener('click', function () {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing) timer = setInterval(function () {
    var v = (+slider.value + 1) % DATA.times.length;
    slider.value = v; setTime(v);
  }, 250); else clearInterval(timer);
});
</script>
</body>
</html>
