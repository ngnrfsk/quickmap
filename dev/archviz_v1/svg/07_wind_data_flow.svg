<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<title>Wind animation data flow</title>
<rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1f2937" text-anchor="start">Wind animation data flow</text>
<text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#4b5563" text-anchor="start">One uniform wind value per time step across the map, rendered by vendored leaflet-velocity. Interactive HTML only.</text>
<rect x="40" y="697" width="14" height="14" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="60" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">R code</text>
<rect x="116.4" y="697" width="14" height="14" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="136.4" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">Configuration in inst/</text>
<rect x="295.20000000000005" y="697" width="14" height="14" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="315.20000000000005" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">Browser JS</text>
<rect x="397.20000000000005" y="697" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="417.20000000000005" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">Input, output or note</text>
<rect x="569.6" y="697" width="14" height="14" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="589.6" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">Code differs from docs</text>
<text x="1240" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="end">R/wind.R, inst/controls/wind-controller.js; W: = R/wind.R</text>
<rect x="40" y="120" width="275" height="230" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="50" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">from_worldmet</text>
<text x="50" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">W:25-58</text>
<text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">Data frame, or</text>
<text x="50" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  worldmet::importNOAA(station,</text>
<text x="50" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  year). Needs date, ws, wd; drops</text>
<text x="50" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  NA. u = -ws sin(wd), v = -ws</text>
<text x="50" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  cos(wd).</text>
<path d="M 315 235 L 348 235" fill="none" stroke="#4b5563" stroke-width="2"/>
<polygon points="348,235 338.8,238.9 338.8,231.1" fill="#4b5563"/>
<rect x="348" y="120" width="275" height="230" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="358" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">build_wind_payload</text>
<text x="358" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">W:86-134</text>
<text x="358" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">Date format chosen from step-label</text>
<text x="358" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  width (4, 7, 10, 13, 16 chars).</text>
<text x="358" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  Mean u and v per step. 2x2 grid</text>
<text x="358" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  over bbox + 3 degrees. maxVelocity</text>
<text x="358" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  = ceiling(max ws) + 2. Empty step</text>
<text x="358" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  is null.</text>
<path d="M 623 235 L 656 235" fill="none" stroke="#4b5563" stroke-width="2"/>
<polygon points="656,235 646.8,238.9 646.8,231.1" fill="#4b5563"/>
<rect x="656" y="120" width="275" height="230" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="666" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">wind_style_options</text>
<text x="666" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">W:140</text>
<text x="666" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">Theme wind block over defaults:</text>
<text x="666" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  colour_ramp to colorScale,</text>
<text x="666" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  particle_density to</text>
<text x="666" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  particleMultiplier, line_width to</text>
<text x="666" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  lineWidth, velocity_scale to</text>
<text x="666" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  velocityScale.</text>
<path d="M 931 235 L 964 235" fill="none" stroke="#4b5563" stroke-width="2"/>
<polygon points="964,235 954.8,238.9 954.8,231.1" fill="#4b5563"/>
<rect x="964" y="120" width="275" height="230" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="974" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Attach to the widget</text>
<text x="974" y="167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">W:173, Q:4335-4343</text>
<text x="974" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">add_wind_layer: onRender(wind-</text>
<text x="974" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  controller.js, payload).</text>
<text x="974" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  velocity_dependency (W:159)</text>
<text x="974" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  inlines the plugin.</text>
<text x="40" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">In the browser</text>
<rect x="40" y="406" width="360" height="150" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="50" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15.3" font-weight="bold" fill="#1f2937" text-anchor="start">quickmapWindController.setTime(label)</text>
<text x="50" y="453" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">wind-controller.js:37. Looks up the frame by</text>
<text x="50" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  label; a null frame removes the layer (13).</text>
<rect x="460" y="406" width="360" height="150" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="470" y="436" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">L.velocityLayer</text>
<text x="470" y="453" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">Created on first call (25) and added to the map;</text>
<text x="470" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  updateData(frame) afterwards (19).</text>
<rect x="880" y="406" width="360" height="150" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="890" y="436" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">leaflet-velocity 2.1.4, patched</text>
<text x="890" y="453" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">Vendored, unminified. QUICKMAP patch markers at</text>
<text x="890" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  lines 103, 341, 823-877, 933, 1019-1036.</text>
<path d="M 1102 350 L 1102 380 L 220 380 L 220 406" fill="none" stroke="#4b5563" stroke-width="2"/>
<polygon points="220,406 216.1,396.8 223.9,396.8" fill="#4b5563"/>
<path d="M 400 481 L 460 481" fill="none" stroke="#4b5563" stroke-width="2"/>
<polygon points="460,481 450.8,484.9 450.8,477.1" fill="#4b5563"/>
<path d="M 820 481 L 880 481" fill="none" stroke="#4b5563" stroke-width="2"/>
<polygon points="880,481 870.8,484.9 870.8,477.1" fill="#4b5563"/>
<rect x="40" y="580" width="1200" height="90" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="50" y="610" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Scope</text>
<text x="50" y="627" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">Interactive maps with temporal data only; never in JPG frames. The field is uniform: one averaged vector for the whole map at each step. Non-uniform fields are a</text>
<text x="50" y="644" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="start">  post-1.0 plan.</text>
</svg>
