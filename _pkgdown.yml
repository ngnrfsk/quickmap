# pkgdown configuration — see dev/260707_manual_prospectus_v1.md.
# The repo went public on 2026-08-15 and the site is served from docs/ by
# GitHub Pages. The manual's example maps are too large to ship inside the
# package (12.6 MB against CRAN's 5 MB), so the chapters embed them from
# this URL instead of relatively — which means the site must stay
# deployed for the built vignettes to show their maps.
url: https://ngnrfsk.github.io/quickmap/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]

# Legacy .md notes retired to vignettes/archive/ (phase 3, 2026-07-11):
# their content is absorbed into the chapters below.
articles:
- title: Working with maps
  navbar: Working with maps
  contents:
  - your-data
  - layers
  - labels
  - boundaries
  - styling
- title: Animation and beyond
  navbar: Animation and beyond
  contents:
  - time
  - wind
  - sharing
- title: Going further
  navbar: Going further
  contents:
  - recipes
  - r-users

reference:
- title: Making maps
  contents:
  - quickmap
  - create_pollution_map
- title: Layers — the atomic unit
  contents:
  - qm_layer
  - qm_meta
  - from_csv
  - from_rdata
  - from_openair
  - from_worldmet
- title: Styling
  contents:
  - load_theme
  - load_colour_scale
  - show_borough_colours
- title: OpenAir interoperability
  contents:
  - convert_openair_to_spatial
  - get_openair_metadata
  - clear_openair_metadata_cache
# Helpers documented without @keywords internal (roxygen cleanup belongs to
# roadmap item 9); the special "internal" title hides them from the index.
- title: internal
  contents:
  - add_boundary_polygons
  - calculate_max_range_width
  - convert_colors_to_hex
  - generate_legend_html
  - geocode_uk_postcodes
  - get_contrast_text_color
  - get_data_maximum
  - get_symbol_for_index
  - inject_banner_legend_controls
  - lighten_color
  - parse_legend_label
